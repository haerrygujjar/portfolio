limit_req_zone $binary_remote_addr zone=portfolio_per_ip:10m rate=20r/s;
limit_req_zone $server_name zone=portfolio_global:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_connections:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;
    keepalive_timeout 20s;
    large_client_header_buffers 2 8k;
    error_log /dev/stderr warn;
    access_log /dev/stdout;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include /etc/nginx/snippets/portfolio-csp.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        limit_req zone=portfolio_per_ip burst=50 nodelay;
        limit_req zone=portfolio_global burst=150 nodelay;
        limit_conn portfolio_connections 30;
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
